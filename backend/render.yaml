services:
  # Backend API Service
  - type: web
    name: file-upload-api
    env: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: MAX_FILES
        value: 5
      - key: CORS_ORIGIN
        sync: false
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

databases:
  # MySQL Database (Optional - bisa pakai Railway MySQL)
  - name: file-upload-db
    databaseName: file_upload_prod
    user: fileupload
    region: singapore
    plan: free
